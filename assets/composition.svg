<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="原子技能组合"><title>原子技能组合</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1556c0"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="48" font-size="30" fill="#123050" font-weight="600" text-anchor="start">学过的单目标，可以怎样重新组合？</text><text x="40" y="101" font-size="20" fill="#647b96" font-weight="400" text-anchor="start">训练：单目标示范</text><rect x="40" y="125" width="335" height="88" rx="12" fill="#e9f2ff" stroke="#d7e5f5"/><text x="207.5" y="160" font-size="22" fill="#123050" font-weight="600" text-anchor="middle">放入容器</text><text x="207.5" y="190" font-size="17" fill="#647b96" font-weight="400" text-anchor="middle">抓取 · 搬运 · 释放</text><rect x="430" y="125" width="335" height="88" rx="12" fill="#e9f2ff" stroke="#d7e5f5"/><text x="597.5" y="160" font-size="22" fill="#123050" font-weight="600" text-anchor="middle">相对放置</text><text x="597.5" y="190" font-size="17" fill="#647b96" font-weight="400" text-anchor="middle">识别参照物 · 建立空间关系</text><rect x="820" y="125" width="335" height="88" rx="12" fill="#e9f2ff" stroke="#d7e5f5"/><text x="987.5" y="160" font-size="22" fill="#123050" font-weight="600" text-anchor="middle">抽屉操作</text><text x="987.5" y="190" font-size="17" fill="#647b96" font-weight="400" text-anchor="middle">打开 / 关闭指定层</text><path d="M200 213 L200 262" fill="none" stroke="#1556c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 213 L600 262" fill="none" stroke="#1556c0" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="299" font-size="20" fill="#647b96" font-weight="400" text-anchor="start">评测：两目标组合</text><text x="40" y="344" font-size="22" fill="#1556c0" font-weight="600" text-anchor="start">重复技能</text><text x="190" y="344" font-size="23" fill="#123050" font-weight="400" text-anchor="start">紫块入盘 + 黄块入盘</text><text x="650" y="344" font-size="22" fill="#1556c0" font-weight="600" text-anchor="start">有序组合</text><text x="800" y="344" font-size="23" fill="#123050" font-weight="400" text-anchor="start">蓝块入盘 + 红块叠蓝块</text><text x="40" y="392" font-size="19" fill="#647b96" font-weight="400" text-anchor="start">组合指令与完整组合轨迹不进入 Piper 适配集；评测组合长度均为 k = 2。</text></g></svg>