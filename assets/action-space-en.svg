<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-label="&#32479;&#19968;80&#32500;&#21160;&#20316;&#31354;&#38388;"><title>&#32479;&#19968;80&#32500;&#21160;&#20316;&#31354;&#38388;</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1556c0"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="47" font-size="30" fill="#123050" font-weight="600" text-anchor="start">Shared action slots across robot embodiments</text><rect x="40" y="90" width="402" height="78" rx="6" fill="#1556c0" stroke="#1556c0"/><text x="241.0" y="122" font-size="20" fill="white" font-weight="500" text-anchor="middle">Left arm</text><text x="241.0" y="150" font-size="17" fill="white" font-weight="400" text-anchor="middle">29D</text><rect x="446" y="90" width="402" height="78" rx="6" fill="#4384d5" stroke="#4384d5"/><text x="647.0" y="122" font-size="20" fill="white" font-weight="500" text-anchor="middle">Right arm</text><text x="647.0" y="150" font-size="17" fill="white" font-weight="400" text-anchor="middle">29D</text><rect x="852" y="90" width="80" height="78" rx="6" fill="#7aa8e1" stroke="#7aa8e1"/><text x="892.0" y="122" font-size="20" fill="#123050" font-weight="500" text-anchor="middle">Base</text><text x="892.0" y="150" font-size="17" fill="#123050" font-weight="400" text-anchor="middle">6D</text><rect x="936" y="90" width="80" height="78" rx="6" fill="#9cc2ed" stroke="#9cc2ed"/><text x="976.0" y="122" font-size="20" fill="#123050" font-weight="500" text-anchor="middle">Torso</text><text x="976.0" y="150" font-size="17" fill="#123050" font-weight="400" text-anchor="middle">6D</text><rect x="1020" y="90" width="80" height="78" rx="6" fill="#b4d5f1" stroke="#b4d5f1"/><text x="1060.0" y="122" font-size="20" fill="#123050" font-weight="500" text-anchor="middle">Head</text><text x="1060.0" y="150" font-size="17" fill="#123050" font-weight="400" text-anchor="middle">6D</text><rect x="1104" y="90" width="52" height="78" rx="6" fill="#d8e8f8" stroke="#d8e8f8"/><text x="1130.0" y="122" font-size="12" fill="#123050" font-weight="500" text-anchor="middle">Reserved</text><text x="1130.0" y="150" font-size="17" fill="#123050" font-weight="400" text-anchor="middle">4D</text><text x="40" y="211" font-size="21" fill="#123050" font-weight="400" text-anchor="start">Each arm: 7 joint + 3 position + 6 rotation + 1 gripper + 12 reserved dimensions</text><text x="40" y="251" font-size="18" fill="#1556c0" font-weight="400" text-anchor="start">Per-dataset q01 / q99 normalization &#8594; Slot mapping &#8594; Validity mask &#8594; Inverse mapping + denormalization</text><text x="40" y="305" font-size="18" fill="#647b96" font-weight="400" text-anchor="start">Validity masks exclude unsupported dimensions without inventing labels for missing controls.</text></g></svg>