<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-label="统一80维动作空间"><title>统一80维动作空间</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1556c0"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="47" font-size="30" fill="#123050" font-weight="600" text-anchor="start">让不同本体，使用同一套动作坐标槽位</text><rect x="40" y="90" width="402" height="78" rx="6" fill="#1556c0" stroke="#1556c0"/><text x="241.0" y="122" font-size="20" fill="white" font-weight="500" text-anchor="middle">左臂</text><text x="241.0" y="150" font-size="17" fill="white" font-weight="400" text-anchor="middle">29D</text><rect x="446" y="90" width="402" height="78" rx="6" fill="#4384d5" stroke="#4384d5"/><text x="647.0" y="122" font-size="20" fill="white" font-weight="500" text-anchor="middle">右臂</text><text x="647.0" y="150" font-size="17" fill="white" font-weight="400" text-anchor="middle">29D</text><rect x="852" y="90" width="80" height="78" rx="6" fill="#7aa8e1" stroke="#7aa8e1"/><text x="892.0" y="122" font-size="20" fill="#123050" font-weight="500" text-anchor="middle">底盘</text><text x="892.0" y="150" font-size="17" fill="#123050" font-weight="400" text-anchor="middle">6D</text><rect x="936" y="90" width="80" height="78" rx="6" fill="#9cc2ed" stroke="#9cc2ed"/><text x="976.0" y="122" font-size="20" fill="#123050" font-weight="500" text-anchor="middle">躯干</text><text x="976.0" y="150" font-size="17" fill="#123050" font-weight="400" text-anchor="middle">6D</text><rect x="1020" y="90" width="80" height="78" rx="6" fill="#b4d5f1" stroke="#b4d5f1"/><text x="1060.0" y="122" font-size="20" fill="#123050" font-weight="500" text-anchor="middle">头部</text><text x="1060.0" y="150" font-size="17" fill="#123050" font-weight="400" text-anchor="middle">6D</text><rect x="1104" y="90" width="52" height="78" rx="6" fill="#d8e8f8" stroke="#d8e8f8"/><text x="1130.0" y="122" font-size="20" fill="#123050" font-weight="500" text-anchor="middle">预留</text><text x="1130.0" y="150" font-size="17" fill="#123050" font-weight="400" text-anchor="middle">4D</text><text x="40" y="211" font-size="21" fill="#123050" font-weight="400" text-anchor="start">每个手臂：7 维关节 + 3 维位置 + 6 维旋转 + 1 维夹爪 + 12 维预留</text><text x="40" y="251" font-size="21" fill="#1556c0" font-weight="400" text-anchor="start">数据集内 q01 / q99 归一化 → 槽位映射 → 有效性掩码 → 逆映射与反归一化</text><text x="40" y="305" font-size="18" fill="#647b96" font-weight="400" text-anchor="start">掩码排除本体不支持的维度，不为缺失关节或控制量制造伪标签。</text></g></svg>